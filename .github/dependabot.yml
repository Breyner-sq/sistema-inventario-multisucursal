# Auditoría de seguridad: no había ningún mecanismo de vigilancia continua de
# dependencias vulnerables — una revisión puntual (esta) queda desactualizada
# apenas se publica un CVE nuevo. Dependabot abre un PR automático por cada
# actualización de seguridad; revisar y fusionar sigue siendo manual.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
