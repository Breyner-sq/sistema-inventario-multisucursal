server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: cualquier ruta no encontrada como archivo estático
    # se resuelve con index.html (necesario en cuanto se agregue enrutamiento
    # client-side en una fase posterior).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
