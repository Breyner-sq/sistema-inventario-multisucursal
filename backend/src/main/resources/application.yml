spring:
  application:
    name: inventario-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    web:
      pageable:
        # docs/API_DESIGN.md, seccion 1: page base 0, size por defecto 20, maximo 100.
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Evita que un `flyway:clean` accidental (o mal configurado en algun entorno)
    # borre el esquema; no hay ningun flujo legitimo de este proyecto que lo necesite.
    clean-disabled: true

server:
  port: 8080

app:
  cors:
    # Origenes del frontend autorizados a llamar a la API desde un navegador.
    # Sin esto el navegador bloquea toda peticion cross-origin (incluido el
    # login). Se sobreescribe por entorno con APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # SIEMPRE sobrescribir JWT_SECRET fuera de desarrollo local (ver .env.example).
    # Minimo 32 caracteres (256 bits) - HS256 rechaza una clave mas corta al arrancar.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-with-JWT_SECRET-env-var-2026}
    # 1 hora: sin revocacion ni refresh token en este alcance (ADR-005), se prioriza
    # una ventana de exposicion corta ante un token filtrado/robado.
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Auditoría de seguridad: /actuator/** es publico (SecurityConfig,
      # permitAll - lo necesita el healthcheck de docker-compose, que no
      # manda token). "always" filtraba rutas de disco, capacidad y motor de
      # BD a cualquiera sin autenticar; con "never" el publico solo ve
      # {"status":"UP"} - el detalle no aporta nada a un healthcheck de
      # infraestructura, que solo mira el status.
      show-details: never

logging:
  # Patron minimo con requestId de correlacion (ver common.web.CorrelationIdFilter)
  # para poder seguir una operacion de punta a punta sin agregar un stack de
  # logging estructurado (JSON) que no esta justificado para el alcance actual
  # (docs/ARCHITECTURE.md, seccion 8).
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-\"-\"}] %logger{36} - %msg%n"
