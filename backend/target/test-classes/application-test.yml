# Perfil exclusivo para tests de este esqueleto (arranque de contexto + /actuator/health).
# Usa H2 en memoria para no depender de una instancia PostgreSQL real - ver la nota
# junto a la dependencia de H2 en pom.xml sobre cuando SI se debe usar PostgreSQL real
# (Testcontainers) en las pruebas de los futuros modulos de negocio.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

# El latido SSE programado no debe dispararse durante las pruebas: un envío
# espontáneo a un emisor simulado hace fallar de forma intermitente a los tests
# que verifican que NO se emitió nada (p. ej. cuando la transacción revierte).
# El latido tiene su propia prueba, que lo invoca directamente
# (EventStreamApiTest#heartbeatReleasesTheSubscriptionOfAClientThatWentAway),
# así que no hace falta que el planificador lo ejecute solo.
app:
  events:
    heartbeat-interval-ms: 86400000
